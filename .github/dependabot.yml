version: 2
updates:
  - package-ecosystem: npm
    directory: /services/auth-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /services/business-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /services/review-service
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /services/inquiry-service
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /services/gateway
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /services/auth-service
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: monthly
