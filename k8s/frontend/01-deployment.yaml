apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: businessconnect
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/businessconnect/frontend:latest
          ports:
            - containerPort: 3000
          env:
            # Nginx envsubst replaces ${GATEWAY_URL} in nginx.conf at container start
            - name: GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: businessconnect-config
                  key: GATEWAY_URL
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
