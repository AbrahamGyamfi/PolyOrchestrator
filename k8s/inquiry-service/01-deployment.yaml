apiVersion: apps/v1
kind: Deployment
metadata:
  name: inquiry-service
  namespace: businessconnect
  labels:
    app: inquiry-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inquiry-service
  template:
    metadata:
      labels:
        app: inquiry-service
    spec:
      containers:
        - name: inquiry-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/businessconnect/inquiry-service:latest
          ports:
            - containerPort: 4004
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: businessconnect-secrets
                  key: DATABASE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: businessconnect-config
                  key: AUTH_SERVICE_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: businessconnect-config
                  key: INQUIRY_PORT
          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "250m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 10
            periodSeconds: 10
