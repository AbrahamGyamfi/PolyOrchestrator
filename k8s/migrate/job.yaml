apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: businessconnect
  labels:
    app: db-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/businessconnect/migrate:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: businessconnect-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
