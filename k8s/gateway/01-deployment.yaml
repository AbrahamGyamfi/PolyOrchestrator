apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: businessconnect
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/businessconnect/gateway:latest
          ports:
            - containerPort: 4000
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: businessconnect-config
                  key: AUTH_SERVICE_URL
            - name: BUSINESS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: businessconnect-config
                  key: BUSINESS_SERVICE_URL
            - name: REVIEW_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: businessconnect-config
                  key: REVIEW_SERVICE_URL
            - name: INQUIRY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: businessconnect-config
                  key: INQUIRY_SERVICE_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: businessconnect-config
                  key: GATEWAY_PORT
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
